;stripper config to wokeify jb_interwebz (get rid of the slurs and encrypted steamids)

;Replacing the vscripts with ones that dont give admin powers to unknown players, make sure you properly installed the new vscripts!

modify:
{
    match:
    {
        "hammerid" "14320"
    }
    replace:
    {
        "vscripts" "interwebz/mod_main.nut"
    }
}

