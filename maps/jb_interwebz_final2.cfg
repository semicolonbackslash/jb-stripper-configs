;adding some logic to make the censor not interfere with the rickroll
modify:
{
    match:
    {
        "hammerid" "598533"
    }
    insert:
    {
        "OnStartTouch" "censor_astley,Disable,,0,-1"
		"OnStartTouch" "censor_astley,Enable,,5,-1"
    }
}

